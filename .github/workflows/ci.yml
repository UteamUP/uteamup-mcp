name: MCP CI/CD

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      # CRA / NIS2 evidence: CycloneDX SBOM is a CI + GitHub Release artifact.
      # Fail this job if the generator crashes. Do not fail on advisory/CVE noise.
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file sbom-mcp.cdx.json \
            --output-format JSON \
            --spec-version 1.6 \
            --ignore-npm-errors
          test -s sbom-mcp.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-mcp-cyclonedx
          path: sbom-mcp.cdx.json
          if-no-files-found: error
      - name: Unit tests
        run: npx jest test/config.test.js test/logger.test.js test/metrics.test.js test/sse-parser.test.js test/marketplace-manifests.test.js
      - name: AI governance boundary
        run: npm run test:ai-governance
      - name: Lint
        run: npm run lint

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

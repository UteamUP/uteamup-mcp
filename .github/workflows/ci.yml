name: MCP CI/CD

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      # CRA / NIS2 evidence: CycloneDX SBOM is a CI + GitHub Release artifact.
      # Fail this job if the generator crashes. Do not fail on advisory/CVE noise.
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file sbom-mcp.cdx.json \
            --output-format JSON \
            --spec-version 1.6 \
            --ignore-npm-errors
          test -s sbom-mcp.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-mcp-cyclonedx
          path: sbom-mcp.cdx.json
          if-no-files-found: error
      - name: Unit tests
        run: npx jest test/config.test.js test/logger.test.js test/metrics.test.js test/sse-parser.test.js test/marketplace-manifests.test.js
      - name: AI governance boundary
        run: npm run test:ai-governance
      - name: Lint
        run: npm run lint

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-sbom:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-file sbom-mcp.cdx.json \
            --output-format JSON \
            --spec-version 1.6 \
            --ignore-npm-errors
          test -s sbom-mcp.cdx.json
      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          sbom-mcp.cdx.json --clobber

  publish-mcp-registry:
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install mcp-publisher v1.8.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          chmod +x /usr/local/bin/mcp-publisher
      - name: Prepare server.json and publish to Official MCP Registry
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' server.json)
          NPM_MCP_NAME=$(curl -fsSL "https://registry.npmjs.org/@uteamup%2fmcp-server/${VERSION}" 2>/dev/null | jq -r '.mcpName // empty' || true)
          if [ "${NPM_MCP_NAME}" = "io.github.UteamUP/mcp-server" ]; then
            cp server.json /tmp/server.publish.json
          else
            echo "npm version ${VERSION} does not yet expose mcpName on registry.npmjs.org; publishing remote streamable-http endpoints."
            jq 'del(.packages)' server.json > /tmp/server.publish.json
          fi
          EXISTING_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.UteamUP%2Fmcp-server/versions/${VERSION}")
          if [ "${EXISTING_CODE}" = "200" ]; then
            PUBLISH_VERSION="${VERSION}.${GITHUB_RUN_NUMBER}"
            echo "Version ${VERSION} already exists on registry; publishing revision ${PUBLISH_VERSION}"
            jq --arg v "${PUBLISH_VERSION}" '.version = $v' /tmp/server.publish.json > /tmp/server.publish.next.json
            mv /tmp/server.publish.next.json /tmp/server.publish.json
          fi
          mcp-publisher validate /tmp/server.publish.json
          mcp-publisher login github-oidc
          mcp-publisher publish /tmp/server.publish.json

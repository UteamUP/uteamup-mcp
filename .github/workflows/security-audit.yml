name: Security Audit

# Recurring SCA for the MCP server: a weekly, independently scheduled
# audit so advisories that land between commits are still surfaced.
# Hard-fails on high+ in production dependencies; tooling-only
# (devDependency) findings are reported as a warning.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: npm audit (production deps, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, soft-warn)
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Outstanding advisories in dev/tooling dependencies. Triage or ratchet."
          fi
          exit 0

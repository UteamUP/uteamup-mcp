name: Security Audit

# Recurring SCA for the MCP server: a weekly, independently scheduled
# audit so advisories that land between commits are still surfaced.
# Hard-fails on high+ in production dependencies; tooling-only
# (devDependency) findings are reported as a warning.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: npm audit (production deps, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, soft-warn)
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Outstanding advisories in dev/tooling dependencies. Triage or ratchet."
          fi
          exit 0
